# Required
version: 2

# Git submodules
submodules:
  include: all
  recursive: true

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

  commands:
    # Install Hugo
    - wget https://github.com/gohugoio/hugo/releases/download/v0.128.0/hugo_extended_0.128.0_linux-amd64.tar.gz
    - tar -zxvf hugo_extended_0.128.0_linux-amd64.tar.gz
    - mkdir -p bin && mv hugo bin/hugo
    # Build the documentation
    - ./bin/hugo --source docs --destination $READTHEDOCS_OUTPUT/html
