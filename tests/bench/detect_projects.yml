      elaborates: true

  - name: cva6
    url: https://github.com/openhwgroup/cva6
    commit: 742dc82a0c706e0a3bfb98b709fd3ee06d50d12a
    kind: "SystemVerilog, Bender, submodules, configuration package variants"
    submodules: true
