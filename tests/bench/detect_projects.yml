# Projects of the bench of "odatix init --detect" (tests/bench/run_detect_bench.py).
#
# Each project is pinned to a commit. "expect" holds what the detection must find:
# origin (a prefix), top, top_in_alternatives, clock, reset, files_min, files_max,
# elaborates, needs_generation, generator, command_contains. "known" lists the
# expectations that fail today, with why: they are reported, not counted as
# regressions. Write an expectation from what the project documents, not from
# what the detection happens to find.

projects:

  - name: picorv32
    url: https://github.com/YosysHQ/picorv32
    commit: ef203c2b0a3fb793280f5114941416c425c5b461
    kind: "Verilog, FuseSoC cores (core + SoC)"
    expect:
      origin: "FuseSoC (picorv32.core)"
      top: "picorv32"
      top_in_alternatives: "picorv32"
      clock: "clk"
      reset: "resetn"
      elaborates: true
    known:
      top: "its AXI and Wishbone wrappers instantiate picorv32, so a wrapper looks like the top"

  - name: serv
    url: https://github.com/olofk/serv
    commit: f200eb2ed7b69ac1c6b8eddd47654522aeee5ce8
    kind: "Verilog, FuseSoC, conditional toplevel"
    expect:
      origin: "FuseSoC (serv.core)"
      top: "serv_rf_top"
      clock: "clk"
      reset: "i_rst"
      elaborates: true

  - name: subservient
    url: https://github.com/olofk/subservient
    commit: d96fc2a9aec8a469c9a23748761d2fc9825960a8
    kind: "Verilog, FuseSoC depending on serv (not vendored)"
    expect:
      origin: "FuseSoC (subservient.core)"
      top: "subservient"
      clock: "i_clk"
      reset: "i_rst"
      elaborates: true
    known:
      elaborates: "needs the serv core (a FuseSoC dependency), not in the repository: dependencies are not fetched"

  - name: ibex
    url: https://github.com/lowRISC/ibex
    commit: 626034d7557ab85a6d989b13011b44296bad26fa
    kind: "SystemVerilog, many FuseSoC cores, vendored IP"
    expect:
      origin: "FuseSoC"
      top: "ibex_top"
      top_in_alternatives: "ibex_top"
      clock: "clk_i"
      reset: "rst_ni"
      elaborates: true
    known:
      top: "ibex_core.core is preferred to ibex_top.core: the score of a declaration counts its files"

  - name: cve2
    url: https://github.com/openhwgroup/cve2
    commit: d7f21568028a1114be663599bd42145dccf28928
    kind: "SystemVerilog, ibex derivative"
    expect:
      origin: "FuseSoC"
      top: "cve2_top"
      top_in_alternatives: "cve2_top"
      clock: "clk_i"
      reset: "rst_ni"
      elaborates: true
    known:
      top: "cve2_core.core is preferred to cve2_top.core: the score of a declaration counts its files"

  - name: cv32e40p
    url: https://github.com/openhwgroup/cv32e40p
    commit: b353438ff469c030c89f6804f3b24a2852880e8b
    kind: "SystemVerilog, Bender (sources as one mapping) and manifests"
    expect:
      origin: "Bender (Bender.yml)"
      top: "cv32e40p_top"
      clock: "clk_i"
      reset: "rst_ni"
      elaborates: true
    known:
      top: "Bender.yml lists the core only, not rtl/cv32e40p_top.sv (core + FPU)"

  - name: cv32e40x
    url: https://github.com/openhwgroup/cv32e40x
