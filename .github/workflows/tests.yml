name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install jobtender (the job handler) and Odatix
        run: |
          python -m pip install "jobtender[web] @ git+https://github.com/jsaussereau/jobtender@v0.1.0"
          python -m pip install -e 'sources[test]'
      - name: Check that the API reference is up to date
        run: make api-docs-check
      - name: Run tests and enforce coverage
        run: make test-coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  # Oldest supported version (python_requires=">=3.6"). setup-python no longer
  # provides it on current runners, hence the container. It catches what only
  # breaks there: syntax, circular imports, old numpy/scipy behaviors.
  test-python36:
    runs-on: ubuntu-latest
    container: python:3.6-bullseye
    steps:
      - uses: actions/checkout@v4
      - name: Install Odatix and test dependencies
        run: |
          python -m pip install --upgrade "pip<22"
          python -m pip install "jobtender[web] @ git+https://github.com/jsaussereau/jobtender@v0.1.0"
          python -m pip install -e 'sources[test]'
      - name: Run tests
        run: make test

  # The documentation site: Hugo builds it with its themes (git submodules) and
  # its stylesheet, then every internal link and anchor of the result is checked.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.162.1"
          extended: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build the stylesheet (Tailwind, not versioned)
        working-directory: docs
        run: |
          npm ci --no-audit --no-fund
          npm run css
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the site and check its links
        run: make docs-check
