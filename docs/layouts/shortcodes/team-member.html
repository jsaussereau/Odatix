<div class="team-member text-center">
    <div class="relative mb-4 rounded-lg overflow-hidden aspect-square">
        {{ if .Get "image" }}
        <img src="{{ .Get "image" }}" alt="{{ .Get "name" }}" class="w-full h-full object-cover">
        {{ else }}
        <div class="w-full h-full bg-gray-200 flex items-center justify-center">
            <svg class="w-20 h-20 text-gray-400" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 14c3.31 0 6-2.69 6-6s-2.69-6-6-6-6 2.69-6 6 2.69 6 6 6zm0 2c-4 0-12 2-12 6v2h24v-2c0-4-8-6-12-6z"/>
            </svg>
        </div>
        {{ end }}
        <div class="absolute bottom-2 right-2 flex gap-2">
            {{ if .Get "linkedin" }}
            <a href="{{ .Get "linkedin" }}" target="_blank" rel="noopener" class="bg-white rounded-full p-2 shadow-md hover:shadow-lg transition-shadow">
                <svg class="w-5 h-5 text-blue-600" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
                </svg>
            </a>
            {{ end }}

            {{ if .Get "github" }}
            <a href="{{ .Get "github" }}" target="_blank" rel="noopener" class="bg-white rounded-full p-2 shadow-md hover:shadow-lg transition-shadow">
                <svg class="w-5 h-5 text-gray-800" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 .5C5.37.5 0 5.87 0 12.5c0 5.3 3.44 9.8 8.2 11.39.6.11.82-.26.82-.58v-2.04c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.33-1.76-1.33-1.76-1.09-.75.08-.74.08-.74 1.2.09 1.83 1.24 1.83 1.24 1.07 1.83 2.8 1.3 3.48.99.11-.78.42-1.3.76-1.6-2.67-.3-5.47-1.34-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.17 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.65.24 2.87.12 3.17.77.84 1.24 1.91 1.24 3.22 0 4.6-2.8 5.62-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58A12 12 0 0 0 24 12.5C24 5.87 18.63.5 12 .5z"/>
                </svg>
            </a>
            {{ end }}
        </div>
    </div>
    <h3 class="text-xl font-bold mb-1">{{ .Get "name" }}</h3>
    <p class="text-gray-600">{{ .Get "title" }}</p>
    {{ if .Get "legend" }}
        <p class="text-gray-600">{{ .Get "legend" }}</p>
    {{ end }}
</div>
