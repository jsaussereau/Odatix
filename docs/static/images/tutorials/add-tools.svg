<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" fill="none" role="img" aria-label="Add unsupported tools: a directory holding a tool.yml becomes a tool available in Odatix">
  <defs>
    <linearGradient id="at-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="at-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="at-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="24" y="18" width="592" height="384" rx="40" fill="url(#at-panel)"/>
  <rect x="24" y="18" width="592" height="384" rx="40" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="96" cy="66" r="150" fill="url(#at-glow)"/>

  <!-- labels -->
  <g fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">
    <text x="64" y="118">a directory with a tool.yml</text>
    <text x="340" y="90">available in Odatix</text>
  </g>

  <!-- tool directory -->
  <path d="M84 134h44c6 0 11 3 14 8l6 10h88c11 0 20 9 20 20v106c0 11-9 20-20 20H84c-11 0-20-9-20-20V154c0-11 9-20 20-20z" fill="url(#at-accent)"/>
  <rect x="82" y="180" width="162" height="98" rx="14" fill="#ffffff"/>
  <g>
    <rect x="96" y="196" width="14" height="14" rx="4" fill="#f59e0b"/>
    <rect x="118" y="199" width="72" height="9" rx="4.5" fill="#cbd5e1"/>
  </g>
  <g>
    <rect x="96" y="224" width="14" height="14" rx="4" fill="#fcd34d"/>
    <rect x="118" y="227" width="56" height="9" rx="4.5" fill="#e2e8f0"/>
  </g>
  <g>
    <rect x="96" y="252" width="14" height="14" rx="4" fill="#fde68a"/>
    <rect x="118" y="255" width="86" height="9" rx="4.5" fill="#e2e8f0"/>
  </g>

  <!-- arrow -->
  <path d="M272 226h30" stroke="#fcd34d" stroke-width="6" stroke-linecap="round"/>
  <path d="m296 214 16 12-16 12" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- tools list -->
  <rect x="340" y="106" width="236" height="234" rx="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <path d="M366 106c-14.4 0-26 11.6-26 26v20h236v-20c0-14.4-11.6-26-26-26z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="362" y="124" width="70" height="10" rx="5" fill="#e2e8f0"/>
  <g fill="#cbd5e1">
    <circle cx="518" cy="129" r="5"/>
    <circle cx="536" cy="129" r="5"/>
    <circle cx="554" cy="129" r="5"/>
  </g>
  <!-- existing tools -->
  <g>
    <rect x="360" y="170" width="196" height="40" rx="13" fill="#f8fafc"/>
    <circle cx="384" cy="190" r="10" fill="#e2e8f0"/>
    <rect x="406" y="185" width="86" height="10" rx="5" fill="#cbd5e1"/>
  </g>
  <g>
    <rect x="360" y="218" width="196" height="40" rx="13" fill="#f8fafc"/>
    <circle cx="384" cy="238" r="10" fill="#e2e8f0"/>
    <rect x="406" y="233" width="62" height="10" rx="5" fill="#cbd5e1"/>
  </g>
  <!-- the tool you just added -->
  <g>
    <rect x="360" y="266" width="196" height="46" rx="15" fill="#fffbeb" stroke="#fde68a" stroke-width="2"/>
    <circle cx="386" cy="289" r="12" fill="#fef3c7"/>
    <path d="M386 282v14M379 289h14" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
    <rect x="410" y="284" width="104" height="10" rx="5" fill="#fcd34d"/>
  </g>
</svg>
