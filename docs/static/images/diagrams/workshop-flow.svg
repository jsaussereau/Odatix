<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 1000 330"
   width="1000"
   height="330"
   role="img"
   aria-labelledby="wf-title wf-desc"
   version="1.1"
   id="svg26"
   sodipodi:docname="workshop-flow.svg"
   inkscape:version="1.4.4 (dcaf3e7d9e, 2026-05-05)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview26"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="3.4666667"
     inkscape:cx="500.04808"
     inkscape:cy="165"
     inkscape:window-width="5120"
     inkscape:window-height="1355"
     inkscape:window-x="0"
     inkscape:window-y="0"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg26" />
  <title
     id="wf-title">How the workshop is organized</title>
  <desc
     id="wf-desc">Three parts: a common track everyone runs on free tools in 75 minutes, then two or three independent modules of your choice — FPGA, open-source ASIC, your own tool, design space, accuracy against cost — then a 45-minute finale where an automated exploration runs for everyone.</desc>
  <style
     id="style1">
    .bg      { fill: #ffffff; }
    .phase   { fill: #eef1fc; stroke: #99abec; stroke-width: 1.5; }
    .choice  { fill: #f8fafc; stroke: #99abec; stroke-width: 1.5; stroke-dasharray: 7 5; }
    .out     { fill: #faf5ff; stroke: #d8b4fe; stroke-width: 1.5; }
    .chip    { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
    .pill    { fill: #ffffff; stroke: #99abec; stroke-width: 1.2; }
    .flow    { fill: none; stroke: #94a3b8; stroke-width: 1.5; }
    .t       { font-family: 'Plus Jakarta Sans', Inter, system-ui, sans-serif; fill: #0f172a; }
    .eyebrow { font-size: 10.5px; font-weight: 700; fill: #64748b; letter-spacing: 0.08em; }
    .h       { font-size: 16px; font-weight: 700; fill: #283680; }
    .h2      { font-size: 16px; font-weight: 700; fill: #7e22ce; }
    .who     { font-size: 11.5px; font-weight: 600; fill: #475569; }
    .mut     { font-size: 11px; fill: #64748b; }
    .lbl     { font-size: 11.5px; font-weight: 600; fill: #0f172a; }
    .note    { font-size: 11px; fill: #94a3b8; }
    .badge   { font-size: 10.5px; font-weight: 700; fill: #283680; letter-spacing: 0.02em; }
  </style>
  <rect
     class="bg"
     width="1000"
     height="330"
     id="rect1" />
  <!-- ░░ Part 1 — common track ░░ -->
  <rect
     class="phase"
     x="24"
     y="88"
     width="258"
     height="160"
     rx="16"
     id="rect2" />
  <text
     class="t eyebrow"
     x="48"
     y="120"
     id="text2">PART 1</text>
  <text
     class="t h"
     x="48"
     y="144"
     id="text3">Common track</text>
  <text
     class="t who"
     x="48"
     y="164"
     id="text4">everyone, together · 75 min</text>
  <rect
     class="chip"
     x="48"
     y="182"
     width="210"
     height="24"
     rx="8"
     id="rect4" />
  <circle
     cx="64"
     cy="194"
     r="4"
     fill="#16a34a"
     id="circle4" />
  <text
     class="t lbl"
     x="76"
     y="198"
     id="text5">Simulate, measure, chart</text>
  <text
     class="t mut"
     x="48"
     y="228"
     id="text6">free simulator only — no license</text>
  <path
     class="flow"
     d="M286 168 H314"
     marker-end="url(#arrow)"
     id="path6" />
  <!-- ░░ Part 2 — the modules ░░ -->
  <rect
     class="choice"
     x="318"
     y="36"
     width="364"
     height="264"
     rx="16"
     id="rect6" />
  <text
     class="t eyebrow"
     x="342"
     y="66"
     id="text7">PART 2</text>
  <text
     class="t h"
     x="342"
     y="90"
     id="text8">Modules, your pick</text>
  <text
     class="t who"
     x="342"
     y="110"
     id="text9">each at their own pace · 30–75 min</text>
  <rect
     class="chip"
     x="342"
     y="124"
     width="316"
     height="24"
     rx="8"
     id="rect10" />
  <circle
     cx="358"
     cy="136"
     r="4"
     fill="#0ea5e9"
     id="circle10" />
  <text
     class="t lbl"
     x="370"
     y="140"
     id="text11">How fast can it go?</text>
  <text
     class="t note"
     x="646"
     y="140"
     text-anchor="end"
     id="text12">FPGA or ASIC synthesis</text>
  <rect
     class="chip"
     x="342"
     y="153"
     width="316"
     height="24"
     rx="8"
     id="rect12" />
  <circle
     cx="358"
     cy="165"
     r="4"
     fill="#0d9488"
     id="circle12" />
  <text
     class="t lbl"
     x="370"
     y="169"
     id="text13">ASIC, open source</text>
  <text
     class="t note"
     x="646"
     y="169"
     text-anchor="end"
     id="text14">LibreLane, sky130</text>
  <rect
     class="chip"
     x="342"
     y="182"
     width="316"
     height="24"
     rx="8"
     id="rect14" />
  <circle
     cx="358"
     cy="194"
     r="4"
     fill="#d97706"
     id="circle14" />
  <text
     class="t lbl"
     x="370"
     y="198"
     id="text15">Bring your own tool</text>
  <text
     class="t note"
     x="646"
     y="198"
     text-anchor="end"
     id="text16">your license</text>
  <rect
     class="chip"
     x="342"
     y="211"
     width="316"
     height="24"
     rx="8"
     id="rect16" />
  <circle
     cx="358"
     cy="223"
     r="4"
     fill="#2563eb"
     id="circle16" />
  <text
     class="t lbl"
     x="370"
     y="227"
     id="text17">Shape your design space</text>
  <text
     class="t note"
     x="646"
     y="227"
     text-anchor="end"
     id="text18">no EDA tool at all</text>
  <rect
     class="chip"
     x="342"
     y="240"
     width="316"
     height="24"
     rx="8"
     id="rect18" />
  <circle
     cx="358"
     cy="252"
     r="4"
     fill="#db2777"
     id="circle18" />
  <text
     class="t lbl"
     x="370"
     y="256"
     id="text19">Accuracy against cost</text>
  <text
     class="t note"
     x="646"
     y="256"
     text-anchor="end"
     id="text20">decibels per LUT</text>
  <text
     class="t mut"
     x="342"
     y="283"
     id="text21">independent of each other — skip any, in any order</text>
  <path
     class="flow"
     d="M686 168 H714"
     marker-end="url(#arrow)"
     id="path21" />
  <!-- ░░ Part 3 — finale ░░ -->
  <rect
     class="out"
     x="718"
     y="88"
     width="258"
     height="160"
     rx="16"
     id="rect21" />
  <text
     class="t eyebrow"
     x="742"
     y="120"
     id="text22">PART 3</text>
  <text
     class="t h2"
     x="742"
     y="144"
     id="text23">Finale</text>
  <text
     class="t who"
     x="742"
     y="164"
     id="text24">everyone · 45 min</text>
  <rect
     class="chip"
     x="742"
     y="182"
     width="210"
     height="24"
     rx="8"
     id="rect24" />
  <circle
     cx="758"
     cy="194"
     r="4"
     fill="#7c3aed"
     id="circle24" />
  <text
     class="t lbl"
     x="770"
     y="198"
     id="text25">Automated exploration</text>
  <text
     class="t mut"
     x="742"
     y="228"
     id="text26">a Pareto front, built live</text>
  <defs
     id="defs26">
    <marker
       id="arrow"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerWidth="7"
       markerHeight="7"
       orient="auto-start-reverse">
      <path
         d="M0 0 L10 5 L0 10 z"
         fill="#94a3b8"
         id="path26" />
    </marker>
  </defs>
</svg>
