<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" width="1000" height="370" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">How the workshop is organized</title>
  <desc id="wf-desc">Three parts: a 75-minute common track everyone runs together — describe, check, synthesize, simulate and chart the design — then two or three independent modules of your choice among six (fmax, accuracy against cost, Python model, open-source ASIC, place and route, design space), then a 45-minute finale where an automated exploration runs for everyone, with an optional two-level exploration afterwards.</desc>
  <style>
    .bg      { fill: #ffffff; }
    .phase   { fill: #eef1fc; stroke: #99abec; stroke-width: 1.5; }
    .choice  { fill: #f8fafc; stroke: #99abec; stroke-width: 1.5; stroke-dasharray: 7 5; }
    .out     { fill: #faf5ff; stroke: #d8b4fe; stroke-width: 1.5; }
    .opt     { fill: #ffffff; stroke: #d8b4fe; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .chip    { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
    .flow    { fill: none; stroke: #94a3b8; stroke-width: 1.5; }
    .t       { font-family: 'Plus Jakarta Sans', Inter, system-ui, sans-serif; fill: #0f172a; }
    .eyebrow { font-size: 10.5px; font-weight: 700; fill: #64748b; letter-spacing: 0.08em; }
    .h       { font-size: 16px; font-weight: 700; fill: #283680; }
    .h2      { font-size: 16px; font-weight: 700; fill: #7e22ce; }
    .who     { font-size: 11.5px; font-weight: 600; fill: #475569; }
    .mut     { font-size: 11px; fill: #64748b; }
    .lbl     { font-size: 11.5px; font-weight: 600; fill: #0f172a; }
    .note    { font-size: 10.5px; fill: #94a3b8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="370"/>
  <!-- Part 1: common track -->
  <rect class="phase" x="16" y="70" width="250" height="232" rx="16"/>
  <text class="t eyebrow" x="38" y="108">PART 1</text>
  <text class="t h" x="38" y="132">Common track</text>
  <text class="t who" x="38" y="152">everyone, together · 75 min</text>
  <rect class="chip" x="38" y="168" width="206" height="24" rx="8"/>
  <circle cx="54" cy="180" r="4" fill="#16a34a"/>
  <text class="t lbl" x="66" y="184">Describe and check the design</text>
  <rect class="chip" x="38" y="197" width="206" height="24" rx="8"/>
  <circle cx="54" cy="209" r="4" fill="#0ea5e9"/>
  <text class="t lbl" x="66" y="213">Synthesize nine configurations</text>
  <rect class="chip" x="38" y="226" width="206" height="24" rx="8"/>
  <circle cx="54" cy="238" r="4" fill="#db2777"/>
  <text class="t lbl" x="66" y="242">Simulate while it synthesizes</text>
  <rect class="chip" x="38" y="255" width="206" height="24" rx="8"/>
  <circle cx="54" cy="267" r="4" fill="#7c3aed"/>
  <text class="t lbl" x="66" y="271">Chart accuracy and cost</text>
  <text class="t mut" x="38" y="290">SystemVerilog or VHDL · free tools</text>
  <path class="flow" d="M270 185 H296" marker-end="url(#arrow)"/>
  <!-- Part 2: modules -->
  <rect class="choice" x="300" y="20" width="420" height="330" rx="16"/>
  <text class="t eyebrow" x="322" y="50">PART 2</text>
  <text class="t h" x="322" y="74">Modules, your pick</text>
  <text class="t who" x="322" y="94">two or three, each at their own pace · 65 min</text>
  <rect class="chip" x="322" y="112" width="376" height="24" rx="8"/>
  <circle cx="338" cy="124" r="4" fill="#0ea5e9"/>
  <text class="t lbl" x="350" y="128">A · How fast can it go?</text>
  <text class="t note" x="686" y="128" text-anchor="end">Yosys, Vivado, Quartus, DC, Genus</text>
  <rect class="chip" x="322" y="143" width="376" height="24" rx="8"/>
  <circle cx="338" cy="155" r="4" fill="#db2777"/>
  <text class="t lbl" x="350" y="159">B · Accuracy against cost</text>
  <text class="t note" x="686" y="159" text-anchor="end">no new run — the finale needs it</text>
  <rect class="chip" x="322" y="174" width="376" height="24" rx="8"/>
  <circle cx="338" cy="186" r="4" fill="#ca8a04"/>
  <text class="t lbl" x="350" y="190">C · The algorithm before the RTL</text>
  <text class="t note" x="686" y="190" text-anchor="end">Python 3</text>
  <rect class="chip" x="322" y="205" width="376" height="24" rx="8"/>
  <circle cx="338" cy="217" r="4" fill="#0d9488"/>
  <text class="t lbl" x="350" y="221">D · ASIC with open-source tools</text>
  <text class="t note" x="686" y="221" text-anchor="end">LibreLane, sky130</text>
  <rect class="chip" x="322" y="236" width="376" height="24" rx="8"/>
  <circle cx="338" cy="248" r="4" fill="#d97706"/>
  <text class="t lbl" x="350" y="252">E · Place and route after synthesis</text>
  <text class="t note" x="686" y="252" text-anchor="end">DC or Genus, and Innovus</text>
  <rect class="chip" x="322" y="267" width="376" height="24" rx="8"/>
  <circle cx="338" cy="279" r="4" fill="#2563eb"/>
  <text class="t lbl" x="350" y="283">F · Shape your own design space</text>
  <text class="t note" x="686" y="283" text-anchor="end">no EDA tool at all</text>
  <text class="t mut" x="322" y="320">independent of each other — skip any, in any order</text>
  <path class="flow" d="M724 185 H750" marker-end="url(#arrow)"/>
  <!-- Part 3: finale -->
  <rect class="out" x="754" y="70" width="230" height="232" rx="16"/>
  <text class="t eyebrow" x="776" y="108">PART 3</text>
  <text class="t h2" x="776" y="132">Finale</text>
  <text class="t who" x="776" y="152">everyone · 45 min</text>
  <rect class="chip" x="776" y="168" width="186" height="24" rx="8"/>
  <circle cx="792" cy="180" r="4" fill="#7c3aed"/>
  <text class="t lbl" x="804" y="184">Let the search do the work</text>
  <text class="t mut" x="776" y="212">a Pareto front, built live</text>
  <rect class="opt" x="776" y="230" width="186" height="44" rx="8"/>
  <text class="t eyebrow" x="788" y="248">OPTIONAL · AFTERWARDS</text>
  <text class="t lbl" x="788" y="265">Two-level exploration</text>
</svg>
