##############################################
# Odatix settings for RTL analysis
##############################################
---

# overwrite existing results
overwrite:        No   # overridden by -o / --overwrite

# prompt 'Continue? (Y/n)' after settings checks
ask_continue:     Yes  # overridden by -y / --noask

# exit monitor when all jobs are done
exit_when_done:   No   # overridden by -E / --exit

# size of the log history per job in the monitor
log_size_limit:   300  # overridden by --logsize

# maximum number of parallel jobs
nb_jobs:          8    # overridden by -j / --jobs ('auto' = number of CPUs minus one)

# eda tools to run the analysis with (overridden by -t / --tool)
tools:
  - vivado
  - verilator
  # - icarus
  # - quartus
  # - design_compiler
  # - genus

# findings that are normal for these designs: they are reported apart, as
# "expected", and do not count. Each one is a set of conditions (category,
# severity, code, subject, file, message, tools, architectures) and a reason.
expected:
  # clock_of_combinational_designs:
  #   category: unused
  #   subject: clock
  #   architectures: [Example_Mult]
  #   reason: "The multiplier is combinational: its clock is only there for the timing constraints"

# targeted architectures (overridden by -a / --architecture)
architectures:

#--------------------------------------------#
# Add your own architectures!
#--------------------------------------------#

  #- Your_Design/Your_1st_Configuration
  #- Your_Design/Your_2nd_Configuration
  #- Your_Design/Your_3rd_Configuration

  ### You can also use wildcards to include all configurations of your design:

  # - Your_Design/*

  ### If your design uses multiple parameter domains:

  # - Your_Design/* + Domain1/Configuration1 + Domain2/*

  ### Designs without any configuration are of course supported:

  # - Your_Design

...
