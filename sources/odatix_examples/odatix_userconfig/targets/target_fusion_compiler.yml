##############################################
# Target settings for Fusion Compiler
##############################################

constraint_file: timing_constraints.txt

tool_install_path: "" # fc_shell should be in your $PATH

script_copy_enable: No
script_copy_source: "/dev/null"

# ASIC technology target
targets:
  - GlobalFoundries22NHSP

# Replace with your own fc_setup.tcl: it gives the
# technology file, the reference libraries and, for physical synthesis and
# place and route, the TLU+ files
target_settings:
  GlobalFoundries22NHSP:
    script_copy_enable: Yes
    script_copy_source: $eda_tools_path/fusion_compiler/technology/GlobalFoundries22NHSP/fc_setup.tcl
