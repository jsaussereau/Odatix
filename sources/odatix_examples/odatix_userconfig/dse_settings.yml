##############################################
# Odatix settings for design space exploration
##############################################
---
# A sweep runs every configuration an architecture describes. That is the right
# thing to do with forty of them and the wrong thing with forty thousand, which
# is what four or five parameters already amount to.
#
# What each exploration is looking for is not written here but in a campaign
# file of its own, under "odatix_userconfig/dse_campaigns". This file says how
# an exploration is run, and which campaigns to run: starting a different
# search is naming a different file, and two campaigns on the same
# architecture keep two answers, each named after its file.

# overwrite existing results
overwrite:        No   # overridden by -o / --overwrite

# prompt 'Continue? (Y/n)' after settings checks
ask_continue:     Yes  # overridden by -y / --noask

# exit monitor when all jobs are done
exit_when_done:   No   # overridden by -E / --exit

# size of the log history per job in the monitor
log_size_limit:   300  # overridden by --logsize

# maximum number of parallel jobs
nb_jobs:          8    # overridden by -j / --jobs ('auto' = number of CPUs minus one)

# campaigns to run, one after the other
#
# Each one is a file of "odatix_userconfig/dse_campaigns", named here without
# its ".yml": "fir_area_speed" is "dse_campaigns/fir_area_speed.yml". What it
# found is written to "results/dse/<campaign>.yml".
campaigns:

#--------------------------------------------#
# Add your own campaigns!
#--------------------------------------------#

  #- your_campaign

#--------------------------------------------#
# Examples
#--------------------------------------------#

  # A filter whose three knobs are handed to the high-level synthesis, searched
  # for the fastest design at the smallest area.
  - fir_area_speed

  # An exploration of a workflow instead of a synthesis: a small image codec
  # whose four knobs describe 3150 encoders, searched for the rate/quality
  # curve none of them is beaten on.
  - image_codec_rate_quality

