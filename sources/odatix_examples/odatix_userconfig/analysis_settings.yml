
##############################################
# Odatix settings for custom freq synthesis
##############################################

# overwrite existing results
overwrite:        No   # overridden by -o / --overwrite

# prompt 'Continue? (Y/n)' after settings checks
ask_continue:     Yes  # overridden by -y / --noask

# exit monitor when all jobs are done
exit_when_done:   No   # overridden by -E / --exit

# size of the log history per job in the monitor
log_size_limit:   300  # overridden by --logsize

# maximum number of parallel jobs
nb_jobs:          8    # overridden by -j / --jobs ('auto' = number of CPUs minus one)

# tested tools
tools: 
  - vivado
  - verilator
  # - design_compiler
  # - genus

# targeted architectures
architectures: 

#--------------------------------------------#
# Add your own designs!
#--------------------------------------------#

  #- Your_Design/Your_1st_Configuration
  #- Your_Design/Your_2nd_Configuration
  #- Your_Design/Your_3rd_Configuration
  
  ### You can also use wildcards to include all configurations of your design: 
  
  # - Your_Design/*

  ### If your design uses mutliple paramter domains:

  # - Your_Design/* + Domain1/Configuration1 + Domain2/* 

  ### Design without any configuration are of course supported:

  # - Your_Design


#--------------------------------------------#
