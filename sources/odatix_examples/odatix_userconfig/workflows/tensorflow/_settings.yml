# Design sources (that will be copied into each work directory)
sources:
  path: examples/workflow_tensorflow

# Progress tracking
progress:
  file: progress.txt
  regex: ".*Progress: ([0-9]+)*"

# Generated design settings
use_parameters: No

# Design workflow settings
tasks:
  - name: main
    dependencies: 
      - /tmp/odatix_tensorflow_example_env/ready
    commands:
      - /tmp/odatix_tensorflow_example_env/bin/python3 train.py

  # Not phony: the task stands for the file it is named after, and is skipped
  # once that file exists. The environment is built once, then reused by every
  # job of every run. The jobs of a run start together: setup_env.py takes a
  # lock, so only one of them builds it while the others wait.
  - name: /tmp/odatix_tensorflow_example_env/ready
    phony: No
    commands:
      - python3 setup_env.py python3
    # TensorFlow is not available for every python version: start again with
    # one it supports.
    on_failure_commands:
      - python3 setup_env.py python3.10
