# Design sources (that will be copied into each work directory)
sources:
  path: examples/workflow_simple

# Progress tracking
progress:
  file: progress.txt
  regex: "Progress:\\s*([0-9]+)"

# Generated design settings
use_parameters: No

# Design workflow settings
#
# This example showcases platform-specific implementations for the same task name.
# Exactly one "main" implementation is selected according to sys.platform.
tasks:
  - name: main
    platforms: [linux, darwin]
    commands:
      - echo 'Linux/MacOS Task...'
      - sleep 1
      - echo 'step 1/3 done'
      - "echo 'Progress: 60' > progress.txt"
      - sleep 1
      - echo 'step 2/3 done'
      - "echo 'Progress: 80' > progress.txt"
      - sleep 1
      - echo 'step 3/3 done'
      - python3 platform_info.py   # writes platform_info.txt
      - python3 main.py            # writes output.txt

  - name: main
    platforms: win32 # cmd.exe, the shell jobs run their commands with on Windows
    commands:
      - echo Windows Task...
      - timeout /t 1 /nobreak > NUL
      - echo step 1/3 done
      - "echo Progress: 60> progress.txt"
      - timeout /t 1 /nobreak > NUL
      - echo step 2/3 done
      - "echo Progress: 80> progress.txt"
      - timeout /t 1 /nobreak > NUL
      - echo step 3/3 done
      - python platform_info.py
      - python main.py
