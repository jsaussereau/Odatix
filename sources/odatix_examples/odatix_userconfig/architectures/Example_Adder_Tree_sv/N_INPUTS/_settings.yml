##############################################
# Settings for Example_Adder_Tree_sv - N_INPUTS
##############################################
# Number of operands, in the package

# Delimiters for parameter files
use_parameters: Yes
param_target_file: tree_config_pkg.sv
start_delimiter: 'N_INPUTS = '
stop_delimiter: ;

# Variables
variables:
  N_INPUTS:
    type: list
    settings:
      list: [4, 8, 16]
