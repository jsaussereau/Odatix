##############################################
# Settings for Example_Adder_Tree_sv - REGISTER_LEVELS
##############################################
# 1: a register after every level of the tree; 0: none

# Delimiters for parameter files
use_parameters: Yes
param_target_file: tree_config_pkg.sv
start_delimiter: 'REGISTER_LEVELS = '
stop_delimiter: ;

# Variables
variables:
  REGISTER_LEVELS:
    type: list
    settings:
      list: [0, 1]
