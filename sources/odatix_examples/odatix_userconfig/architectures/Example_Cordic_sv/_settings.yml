##############################################
# Settings for Example_Cordic_sv
##############################################
# Pipelined CORDIC rotation core.
# The configurations sweep the datapath width and the number of rotation
# stages, which trades accuracy for area and latency.

# Source files
rtl_path: "examples/cordic_sv"
top_level_file: "cordic.sv"
top_level_module: "cordic"

# Signals
clock_signal: "clock"
reset_signal: "reset"

# Delimiters for parameter files
use_parameters: No
start_delimiter: ""
stop_delimiter: ""

# Testbench, run by the simulation templates (ghdl, questa, xsim, ...). It
# checks the outputs against a reference model, which needs the width and the
# number of iterations of the configuration under test: ${width} and
# ${iterations} are the values of the two parameter domains.
testbench:
  top: tb_cordic
  files: [examples/cordic_tb/tb_cordic.sv]
  parameters:
    WIDTH: ${width}
    ITERATIONS: ${iterations}

# Default frequencies (in MHz)
fmax_synthesis:
  lower_bound: 50
  upper_bound: 800
fixed_freq_synthesis:
  list: [50, 100, 200]
