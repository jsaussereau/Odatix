start_delimiter: "  // test parameters begin"
stop_delimiter: "  // test parameters end"

# Configurations
configurations:
  name: "config_${var}..${var_func}"
  template: "parameter VALUE_START = $var;\n parameter VALUE_END = ${var_func};"

variables:
  var:
    type: multiples
    settings:
      from: 0
      to: 56
      base: 8
  var_func:
    type: function
    settings:
      op: ${var}+7
