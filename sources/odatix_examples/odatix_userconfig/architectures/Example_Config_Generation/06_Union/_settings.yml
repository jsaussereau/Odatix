start_delimiter: "  // test parameters begin"
stop_delimiter: "  // test parameters end"

# Configurations
configurations:
  name: "config_${union_var}"
  template: "parameter VALUE = ${union_var};"

variables:
  var_1:
    type: list
    settings:
      list: [50, 60]
  var_2:
    type: list
    settings:
      list: [10, 100]
  union_var:
    type: union
    settings:
      sources: [var_1, var_2]
