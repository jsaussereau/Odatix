##############################################
# Settings for Example_Cordic_vhdl - iterations
##############################################
# Number of rotation stages of the CORDIC, written in the generic clause of
# examples/cordic_vhdl/cordic.vhdl:
#
#   generic (
#     ...
#     ITERATIONS : integer := 12
#   );
#
# It is the last item of the clause, so the replacement stops at the end of
# the line rather than at a separator.

# Delimiters for parameter files
use_parameters: Yes
param_target_file: ''
start_delimiter: 'ITERATIONS : integer := '
stop_delimiter: '\n'

# Configuration generation
generate_configurations: No
