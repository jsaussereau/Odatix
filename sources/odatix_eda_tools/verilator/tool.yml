##################################################
# Settings for Verilator (RTL Analysis)
##################################################

# Display metadata (used by the GUI tool selection page)
label: "Verilator"
description: "Open Source Verilator RTL analysis"
icon: "assets/icons/verilator.png"
icon_filter: true

process_group: True

# No metrics file: an RTL analysis reports a status, errors and warnings, not
# metrics read from reports.
# Name of the flow the commands declared in the platform sections below belong
# to. It is the flow used when "--flow" is not given.
default_flow: lint

unix:

  constants:
    - &verilator_unix verilator

  # Check if Verilator is installed
  tool_test_command:
    - *verilator_unix
    - --version

  # RTL Analysis
  analysis_command:
    - cd $work_path;
    - make -f $eda_tools_path/verilator/makefile.mk analyze

# Windows has neither make nor a POSIX shell: a script does what the makefile
# does. It needs Verilator (verilator, or verilator_bin as OSS CAD Suite ships it) in the PATH.
windows:

  tool_test_command: '"$python" "$eda_tools_path/_common/rtl_analysis.py" verilator --version'

  analysis_command:
    - cd /d "$work_path" &&
    - '"$python" "$eda_tools_path/_common/rtl_analysis.py" verilator'

##############################################
# Flows
##############################################
# Different ways of running the same job type with this tool. The commands
# declared in the platform sections above are those of the default flow.

flows:
  lint:
    label: "Lint"
    description: "Verilator lint / elaboration check"

# Log formatting
format:

  logs:
    error:         ['<error>', 'Error:']
    warning:       ['<warning>', 'Warning:']
    info:          ['<note>', 'Information:']
    trace:         ['<trace>', 'Command:']

  tags:
    bold:          ['<bold>']
    end:           ['<end>']
    black:         ['<black>']
    red:           ['<red>']
    green:         ['<green>']
    yellow:        ['<yellow>']
    blue:          ['<blue>']
    magenta:       ['<magenta>']
    cyan:          ['<cyan>']
    grey:          ['<grey>']
    white:         ['<lgrey>']
    light_red:     ['<lred>']
    light_green:   ['<lgreen>']
    light_yellow:  ['<lyellow>']
    light_blue:    ['<lblue>']
    light_magenta: ['<lmagenta>']
    light_cyan:    ['<lcyan>']
    light_white:   ['<white>']

  replace:
    - "(.* completed successfully)": "<green>$1<end>"