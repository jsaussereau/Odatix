##############################################
# Metrics for LibreLane
##############################################

# Results are exported once per step of the flow (see odatix.lib.results_schema),
# so a metric is declared once and read from the report of each step: "$step" in
# a file name is the step the record being written is for. The area after
# synthesis and after routing are therefore the same metric measured at two
# steps.
#
# report/<step>/metrics.json holds the metrics LibreLane measured up to that
# step, under the names below (power in mW); librelane_metrics.json next to it
# holds all of them under LibreLane's own names, for metrics of your own. A
# metric LibreLane has not measured yet at a step (the die area after synthesis)
# simply has no value there.
#
# Cell_Area and Cell_count leave out the cells placement adds to fill the rows
# (fill, decap, tap and endcap cells); Total_Cell_Area and Total_Cell_count
# count them.

fmax_synthesis_metrics:
  Fmax:
    type: regex
    settings:
      file: report/$step/frequency_search.log
      pattern: "(.*)Highest frequency with timing constraints being met: ([0-9_]+) MHz"
      group_id: 2
    format: "%.0f"
    unit: MHz

custom_freq_synthesis_metrics:
  Frequency:
    type: regex
    settings:
      file: frequency.txt
      pattern: "([0-9_]+) MHz"
      group_id: 1
    format: "%.0f"
    unit: MHz

metrics:
  Cell_Area:
    type: json
    error_if_missing: No
    settings:
      file: report/$step/metrics.json
      key: Cell_Area
    format: "%.3f"
    unit: um^2

  Cell_count:
    type: json
    error_if_missing: No
    settings:
      file: report/$step/metrics.json
      key: Cell_count
    format: "%.0f"

