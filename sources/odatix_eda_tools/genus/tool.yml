##############################################
# Settings for Genus
##############################################

# Display metadata (used by the GUI tool selection page)
label: "Genus"
description: "Cadence® Genus™ Synthesis Solution"
icon: "assets/icons/cadence.png"
icon_filter: true

process_group: True

# Default metrics file for this tool
default_metrics_file: $eda_tools_path/genus/metrics.yml

# Name of the flow the commands declared in the platform sections below belong
# to. It is the flow used when "--flow" is not given.
default_flow: standard

# Parameters of the default flow: the strategy the scripts follow when they
# synthesize the design (see odatix_genus_synthesize in tcl/synth_common.tcl).
# Every flow starts from these and changes only what it says, so the flows at
# the bottom of this file are strategies, not scripts.
parameters:
  effort: high
  generic_effort: ""
  map_effort: ""
  opt_effort: ""
  auto_ungroup: ""
  area_mode: false
  tns_opto: ""
  ultra_optimization: false
  retime: false
  clock_gating: false
  power_effort: none
  leakage_power_effort: ""
  attributes: []
  incremental: false
  post_opt_passes: []

unix:
  # Optional constants (anchors) for reuse
  constants:
    - &genus_unix genus
    - &genus_args -batch -execute

  # Command to check if the tool is installed
  tool_test_command:
    - *genus_unix
    - "-version"
    - "exit"

  # Command for fmax synthesis
  fmax_synthesis_command:
    - cd $work_path;
    - *genus_unix
    - "-log log/fmax.log"
    - *genus_args
    - "'source scripts/find_fmax.tcl; quit'"

  # Command for RTL analysis
  analysis_command:
    - cd $work_path;
    - *genus_unix
    - "-log log/analysis.log"
    - *genus_args
    - "'set odatix_mode analysis; source scripts/init_script.tcl; source scripts/analyze_script.tcl; quit'"

  # Command for custom frequency synthesis
  custom_freq_synthesis_command:
    - cd $work_path;
    - *genus_unix
    - "-log log/custom_freq.log"
    - *genus_args
    - "'source scripts/init_script.tcl; source scripts/analyze_script.tcl; source scripts/synth_script.tcl; quit'"

##############################################
# Flows
##############################################
# A flow is a synthesis strategy. Flows of the same tool are alternatives meant
# to be compared, so each one gets its own work directory ("genus@timing") and
# its results are tagged with its name. A design space exploration can choose
# between them (see "flow" in the DSE settings).
#
# Each flow only sets the parameters it changes: the commands and the scripts
# are the default flow's. Add a strategy of your own the same way, in the
# tool.yml of your workspace.

flows:

  standard:
    label: "Standard"
    description: "syn_generic, syn_map and syn_opt at high effort, the historical Odatix flow"

  medium_effort:
    label: "Medium effort"
    description: "syn_generic, syn_map and syn_opt at medium effort, for a faster run"
    parameters:
      effort: medium

  extreme:
    label: "Extreme"
    description: "extreme syn_opt effort, then an incremental pass with ultra optimization"
    parameters:
      opt_effort: extreme
      ultra_optimization: true
      incremental: true

  timing:
    label: "Timing"
    description: "register retiming and extreme syn_opt effort, then an incremental pass"
    parameters:
      opt_effort: extreme
      auto_ungroup: timing
      retime: true
      ultra_optimization: true
      incremental: true

  area:
    label: "Area"
    description: "area oriented datapath and ungrouping, only the worst path optimized, then an incremental pass"
    parameters:
      auto_ungroup: area
      area_mode: true
      tns_opto: false
      incremental: true

  power:
    label: "Power"
    description: "clock gating and high dynamic and leakage power optimization effort"
    parameters:
      clock_gating: true
      power_effort: high
      leakage_power_effort: high

# Log formatting
format:

  # Format the whole log line
  logs:
    error:         ['<error>', 'Error:']
    warning:       ['<warning>', 'Warning:']
    info:          ['<note>', 'Information:']
    trace:         ['<trace>', 'Command:']

  # Format tags (replaced by the corresponding format escape code)
  tags:
    bold:          ['<bold>']
    end:           ['<end>']
    black:         ['<black>']
    red:           ['<red>']
    green:         ['<green>']
    yellow:        ['<yellow>']
    blue:          ['<blue>']
    magenta:       ['<magenta>']
    cyan:          ['<cyan>']
    grey:          ['<grey>']
    white:         ['<lgrey>']
    light_red:     ['<lred>']
    light_green:   ['<lgreen>']
    light_yellow:  ['<lyellow>']
    light_blue:    ['<lblue>']
    light_magenta: ['<lmagenta>']
    light_cyan:    ['<lcyan>']
    light_white:   ['<white>']
  
  # Replace sequences (regular expressions)
  replace:
    - "(Slack \\(VIOLATED\\))": "<red>$1<end>"
    - "(Slack \\(MET\\))": "<green>$1<end>"
    - "(.* completed successfully)": "<green>$1<end>"
