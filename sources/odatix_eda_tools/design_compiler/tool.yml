##############################################
# Settings for Design Compiler
##############################################

# Display metadata (used by the GUI tool selection page)
label: "Design Compiler"
description: "Synopsys® Design Compiler®"
icon: "assets/icons/synopsys.png"

process_group: True

# Default metrics file for this tool
default_metrics_file: $eda_tools_path/design_compiler/metrics.yml

# Name of the flow the commands declared in the platform sections below belong
# to. It is the flow used when "--flow" is not given.
default_flow: standard

# Parameters of the default flow: the binary it runs and the strategy the
# scripts follow when they compile the design (see odatix_dc_compile in
# tcl/step_common.tcl). Every flow starts from these and changes only what it
# says, so the flows at the bottom of this file are strategies, not scripts.
# A tool extending this one changes the binary the same way (see dc_nxt).
parameters:
  shell: dc_shell
  compile: compile
  compile_options: []
  max_area: ""
  leakage_optimization: false
  dynamic_optimization: false
  gate_clock: false
  incremental: false
  incremental_options: []
  post_compile_passes: []

unix:
  # Optional constants (anchors) for reuse
  constants:
    - &dc_unix $shell
    - &dc_args -x

  # Command to check if the tool is installed
  tool_test_command:
    - *dc_unix
    - *dc_args
    - "exit"

  ##############################################
  # Steps
  ##############################################
  # Synthesis jobs are split into ordered steps. Each step runs as its own
  # dc_shell process, so a run can stop at any of them ("--until") and a later
  # run picks up where it left off instead of starting over. Nothing survives in
  # memory from one process to the next: a step hands its design over through a
  # .ddc database, and the next one reads it back.
  #
  # Every flow of this tool runs these steps: the flows declared at the bottom
  # of this file only change the parameters the compilation follows.

  # Steps of an fmax search. The search itself is one step: unlike an FPGA flow,
  # there is no post-route timing to search on again. It analyzes and elaborates
  # the design once, then only replays the compilation at each frequency it
  # tries (see synth_script.tcl), and the netlist "odatix pnr" starts from is
  # exported by the iteration that met timing at the frequency it reports.
  fmax_synthesis_steps:
    - name: search
      default: true
      command:
        - cd $work_path;
        - *dc_unix
        - "-output_log_file log/fmax.log"
        - *dc_args
        - "'source scripts/find_fmax.tcl; quit'"

  # Steps of a custom frequency synthesis. Here each step continues from the
  # database the previous one wrote, so nothing is elaborated or compiled twice.
  # Only the last one exports the netlist "odatix pnr" starts from: a run after
  # nothing but area, timing and power stops at "synthesis", which is where the
  # metrics are read from.
  custom_freq_synthesis_steps:
    - name: elaborate
      command:
        - cd $work_path;
        - *dc_unix
        - "-output_log_file log/elaborate.log"
        - *dc_args
        - "'source scripts/init_script.tcl; source scripts/analyze_script.tcl; source scripts/step_elaborate.tcl; quit'"
    - name: synthesis
      default: true
      command:
        - cd $work_path;
        - *dc_unix
        - "-output_log_file log/custom_freq.log"
        - *dc_args
        - "'source scripts/step_synthesis.tcl; quit'"
    - name: netlist
      command:
        - cd $work_path;
        - *dc_unix
        - "-output_log_file log/netlist.log"
        - *dc_args
        - "'source scripts/step_netlist.tcl; quit'"

  # Command for RTL analysis
  analysis_command:
    - cd $work_path;
    - *dc_unix
    - "-output_log_file log/analysis.log"
    - *dc_args
    - "'set odatix_mode analysis; source scripts/init_script.tcl; source scripts/analyze_script.tcl; quit'"

##############################################
# Flows
##############################################
# A flow is a synthesis strategy. Flows of the same tool are alternatives meant
# to be compared, so each one gets its own work directory
# ("design_compiler@ultra_timing") and its results are tagged with its name. A
# design space exploration can choose between them (see "flow" in the DSE
# settings).
#
# Each flow only sets the parameters it changes: the steps, the scripts and the
# binary are the default flow's. Add a strategy of your own the same way, in the
# tool.yml of your workspace.

flows:

  standard:
    label: "Standard"
    description: "compile: medium effort mapping, the historical Odatix flow"

  high_effort:
    label: "High effort"
    description: "compile with high mapping and area effort and boundary optimization"
    parameters:
      compile_options: [-map_effort, high, -area_effort, high, -boundary_optimization]

  ultra:
    label: "Ultra"
    description: "compile_ultra with its default settings (DesignWare, auto-ungrouping)"
    parameters:
      compile: compile_ultra

  ultra_timing:
    label: "Ultra - timing"
    description: "compile_ultra high timing effort with register retiming, then an incremental pass"
    parameters:
      compile: compile_ultra
      compile_options: [-timing_high_effort_script, -retime]
      incremental: true
      incremental_options: [-retime]

  ultra_area:
    label: "Ultra - area"
    description: "compile_ultra with area recovery, then a netlist area optimization pass"
    parameters:
      compile: compile_ultra
      # Ignored by recent versions (OPT-1341), which do the same through
      # optimize_netlist; kept for the versions that still honor it.
      compile_options: [-area_high_effort_script]
      max_area: 0
      post_compile_passes: ["optimize_netlist -area"]

  ultra_power:
    label: "Ultra - power"
    description: "compile_ultra with clock gating and leakage and dynamic power optimization"
    parameters:
      compile: compile_ultra
      gate_clock: true
      leakage_optimization: true
      dynamic_optimization: true

# Log formatting
format:

  # Format the whole log line
  logs:
    error:         ['<error>', 'Error:']
    warning:       ['<warning>', 'Warning:']
    info:          ['<note>', 'Information:']
    trace:         ['<trace>', 'Command:']

  # Format tags (replaced by the corresponding format escape code)
  tags:
    bold:          ['<bold>']
    end:           ['<end>']
    black:         ['<black>']
    red:           ['<red>']
    green:         ['<green>']
    yellow:        ['<yellow>']
    blue:          ['<blue>']
    magenta:       ['<magenta>']
    cyan:          ['<cyan>']
    grey:          ['<grey>']
    white:         ['<lgrey>']
    light_red:     ['<lred>']
    light_green:   ['<lgreen>']
    light_yellow:  ['<lyellow>']
    light_blue:    ['<lblue>']
    light_magenta: ['<lmagenta>']
    light_cyan:    ['<lcyan>']
    light_white:   ['<white>']
  
  # Replace sequences (regular expressions)
  replace:
    - "(Slack \\(VIOLATED\\))": "<red>$1<end>"
    - "(Slack \\(MET\\))": "<green>$1<end>"
    - "(.* completed successfully)": "<green>$1<end>"
