##############################################
# Metrics for Vivado
##############################################

fmax_synthesis_metrics:
  Fmax:
    type: regex
    settings:
      file: log/frequency_search.log
      pattern: "(.*)Highest frequency with timing constraints being met: ([0-9_]+) MHz"
      group_id: 2
    format: "%.0f"
    unit: MHz

custom_freq_synthesis_metrics:
  Frequency:
    type: regex
    settings:
      file: frequency.txt
      pattern: "([0-9_]+) MHz"
      group_id: 1
    format: "%.0f"
    unit: MHz

metrics:

  # Synthesis metrics

  LUT_count_synth:
    type: regex
    step: synthesis
    settings:
      file: report/$step/utilization.rep
      pattern: "\\| (Slice|CLB) LUTs \\s*\\|\\s*([0-9]+).*"
      group_id: 2
    format: "%.0f"

  Reg_count_synth:
    type: regex
    step: synthesis
    settings:
      file: report/$step/utilization.rep
      pattern: "\\| (Slice|CLB) Registers \\s*\\|\\s*([0-9]+).*"
      group_id: 2
    format: "%.0f"

  Reg_count_pnr:
    type: regex
    step: pnr
    settings:
      file: report/$step/utilization.rep
      pattern: "\\| (Slice|CLB) Registers \\s*\\|\\s*([0-9]+).*"
      group_id: 2
    format: "%.0f"

  LUT_percent_synth:
    type: regex
    step: synthesis
    settings:
      file: report/$step/utilization.rep
      pattern: "\\| (?:Slice|CLB) LUTs .*\\|\\s*([0-9.]+)\\s*\\|.*"
      group_id: 1
    format: "%.2f"

  Reg_percent_synth:
    type: regex
    step: synthesis
    settings:
      file: report/$step/utilization.rep
      pattern: "\\| (?:Slice|CLB) Registers .*\\|\\s*([0-9.]+)\\s*\\|.*"
      group_id: 1
    format: "%.2f"

  BRAM_count_synth:
    type: regex
    step: synthesis
    settings:
      file: report/$step/utilization.rep
      pattern: "\\| Block RAM Tile (\\s*)\\|(\\s*)([0-9.]+)(.*)"
      group_id: 3
    format: "%.0f"

  BRAM_percent_synth:
    type: regex
    step: synthesis
    settings:
      file: report/$step/utilization.rep
      pattern: "\\| Block RAM Tile .*\\|\\s*([0-9.]+)\\s*\\|.*"
      group_id: 1
    format: "%.2f"

  DSP_count_synth:
    type: regex
    step: synthesis
    settings:
      file: report/$step/utilization.rep
      pattern: "\\| DSPs (\\s*)\\|(\\s*)([0-9]+)(.*)"
      group_id: 3
    format: "%.0f"

  DSP_percent_synth:
    type: regex
    step: synthesis
    settings:
      file: report/$step/utilization.rep
      pattern: "\\| DSPs .*\\|\\s*([0-9.]+)\\s*\\|.*"
      group_id: 1
    format: "%.2f"

  Static_Power_synth:
    type: regex
    step: synthesis
    error_if_missing: No
    settings:
      file: report/$step/power.rep
      pattern: "\\| Device Static \\(W\\) (\\s*)\\|(\\s*)([0-9.]+)(.*)"
      group_id: 3
    format: "%.3f"
    unit: W

  Dynamic_Power_synth:
    type: regex
    step: synthesis
    error_if_missing: No
    settings:
      file: report/$step/power.rep
      pattern: "\\| Dynamic \\(W\\) (\\s*)\\|(\\s*)([0-9.]+)(.*)"
      group_id: 3
    format: "%.3f"
    unit: W

  LUT+Reg_count_synth:
    type: operation
    step: synthesis
    error_if_missing: No
    settings:
      op: LUT_count_synth + Reg_count_synth
    format: "%.0f"

  Total_Power_synth:
    type: operation
    step: synthesis
    error_if_missing: No
    settings:
      op: Static_Power_synth + Dynamic_Power_synth
    format: "%.3f"
    unit: W


  # PNR metrics

  LUT_count:
    type: regex
    step: pnr
    settings:
      file: report/utilization.rep
      pattern: "\\| (Slice|CLB) LUTs \\s*\\|\\s*([0-9]+).*"
      group_id: 2
    format: "%.0f"

  LUT_percent:
    type: regex
    step: pnr
    settings:
      file: report/utilization.rep
      pattern: "\\| (?:Slice|CLB) LUTs .*\\|\\s*([0-9.]+)\\s*\\|.*"
      group_id: 1
    format: "%.2f"

  Reg_count:
    type: regex
    step: pnr
    settings:
      file: report/utilization.rep
      pattern: "\\| (Slice|CLB) Registers \\s*\\|\\s*([0-9]+).*"
      group_id: 2
    format: "%.0f"

  Reg_percent:
    type: regex
    step: pnr
    settings:
      file: report/utilization.rep
      pattern: "\\| (?:Slice|CLB) Registers .*\\|\\s*([0-9.]+)\\s*\\|.*"
      group_id: 1
    format: "%.2f"

  LUT+Reg_count:
    type: operation
    step: pnr
    settings:
      op: LUT_count + Reg_count
    format: "%.0f"

  BRAM_count:
    type: regex
    step: pnr
    settings:
      file: report/utilization.rep
      pattern: "\\| Block RAM Tile (\\s*)\\|(\\s*)([0-9]+)(.*)"
      group_id: 3
    format: "%.0f"

  BRAM_percent:
    type: regex
    step: pnr
    settings:
      file: report/utilization.rep
      pattern: "\\| Block RAM Tile .*\\|\\s*([0-9.]+)\\s*\\|.*"
      group_id: 1
    format: "%.2f"

  DSP_count:
    type: regex
    step: pnr
    settings:
      file: report/utilization.rep
      pattern: "\\| DSPs (\\s*)\\|(\\s*)([0-9]+)(.*)"
      group_id: 3
    format: "%.0f"

  DSP_percent:
    type: regex
    step: pnr
    settings:
      file: report/utilization.rep
      pattern: "\\| DSPs .*\\|\\s*([0-9.]+)\\s*\\|.*"
      group_id: 1
    format: "%.2f"

  Static_Power:
    type: regex
    step: pnr
    settings:
      file: report/power.rep
      pattern: "\\| Device Static \\(W\\) (\\s*)\\|(\\s*)([0-9.]+)(.*)"
      group_id: 3
    format: "%.3f"
    unit: W

  Dynamic_Power:
    type: regex
    step: pnr
    settings:
      file: report/power.rep
      pattern: "\\| Dynamic \\(W\\) (\\s*)\\|(\\s*)([0-9.]+)(.*)"
      group_id: 3
    format: "%.3f"
    unit: W

  Total_Power:
    type: operation
    step: pnr
    settings:
      op: Static_Power + Dynamic_Power
    format: "%.3f"
    unit: W

  LUT_pnr_delta:
    type: operation
    step: pnr
    error_if_missing: No
    settings:
      op: LUT_count - LUT_count_synth
    format: "%.0f"

  Reg_pnr_delta:
    type: operation
    step: pnr
    error_if_missing: No
    settings:
      op: Reg_count - Reg_count_synth
    format: "%.0f"


  # Always

  Param_Domains:
    type: yaml
    error_if_missing: No
    settings:
      file: param_domains.yml
