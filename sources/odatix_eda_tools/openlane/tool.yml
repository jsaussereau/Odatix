##############################################
# Settings for OpenLane
##############################################

# Display metadata (used by the GUI tool selection page)
label: "OpenLane"
description: "Open Source OpenLane flow"
icon: "assets/icons/openroad.png"

# Group processes
process_group: False

# Default metrics file for this tool
default_metrics_file: $eda_tools_path/openlane/metrics.yml

# Name of the flow the commands declared in the platform sections below belong
# to. It is the flow used when "--flow" is not given.
default_flow: synthesis

unix:

  # Command to check if the tool is installed
  tool_test_command: 
    - make -f $eda_tools_path/openlane/makefile.mk test_tool
    - TOOL_INSTALL_PATH=$tool_install_path

  # Command for fmax synthesis
  fmax_synthesis_command: 
    - make -f $eda_tools_path/openlane/makefile.mk synth_fmax
    - EDA_TOOLS_PATH=$eda_tools_path
    - TOOL_INSTALL_PATH=$tool_install_path
    - WORK_DIR=$work_path
    - REPORT_DIR=$work_path/runs/odatix/reports
    - SCRIPT_DIR=$script_path
    - LOG_DIR=$log_path
    - LIB_NAME=$lib_name

##############################################
# Flows
##############################################
# Different ways of running the same job type with this tool. The commands
# declared in the platform sections above are those of the default flow.

flows:
  synthesis:
    label: "Synthesis"
    description: "OpenLane synthesis flow"
