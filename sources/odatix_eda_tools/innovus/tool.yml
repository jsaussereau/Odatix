##############################################
# Settings for Innovus
##############################################
#
# Innovus places & routes a netlist another tool synthesized: it is a place &
# route tool only, so the only job type it declares is "pnr". Run it on the
# results of a Design Compiler or Genus synthesis with
#
#   odatix synth -t design_compiler
#   odatix pnr  -t innovus --from-tool design_compiler
#
# The synthesis hands its netlist over through three files it writes in its
# result directory (netlist.v, design.sdc, design.sdf); Odatix points
# $source_netlist, $source_sdc and $source_sdf at them, and $source_work_path at
# the synthesis job directory itself.
#

# Display metadata (used by the GUI tool selection page)
label: "Innovus"
description: "Cadence® Innovus™ Implementation System"
icon: "assets/icons/cadence.png"
icon_filter: true

process_group: True

# Default metrics file for this tool
default_metrics_file: $eda_tools_path/innovus/metrics.yml

# Name of the flow the commands declared in the platform section below belong
# to. It is the flow used when "--flow" is not given.
default_flow: standard

# Parameters of the default flow: the strategy the step scripts follow (see
# odatix_apply_flow_modes in tcl/pnr_common.tcl). Every flow starts from these
# and changes only what it says, so the flows at the bottom of this file are
# strategies, not scripts.
parameters:
  # setDesignMode -flowEffort: express, standard or extreme
  flow_effort: standard
  # setDesignMode -powerEffort: none, low or high
  power_effort: none
  # Floorplan: core utilization, aspect ratio (height / width) and the margin
  # between the core and the die edge, in microns
  utilization: 0.7
  aspect_ratio: 1.0
  core_margin: 10
  # Options added to setDesignMode, setPlaceMode, setOptMode and
  # setNanoRouteMode. Quote the booleans ("true"): a bare one reaches Tcl as 1.
  design_options: []
  place_options: []
  opt_options: []
  route_options: []
  # Hold fixing after clock tree synthesis and after routing
  fix_hold: false

unix:
  constants:
    - &innovus_unix innovus
    - &innovus_args -no_gui -batch -overwrite -files

  # Command to check if the tool is installed
  tool_test_command:
    - *innovus_unix
    - -version

  # Place & route, split into resumable steps. Each step runs as its own Innovus
  # process and hands the design over through a saved design database, so a run
  # can stop at any of them ("--until route") and a later one picks up there
  # instead of starting over.
  pnr_steps:
    - name: init
      command:
        - cd $work_path;
        - *innovus_unix
        - "-log log/pnr_init.log"
        - *innovus_args
        - $script_path/step_init.tcl
    - name: place
      command:
        - cd $work_path;
        - *innovus_unix
        - "-log log/pnr_place.log"
        - *innovus_args
        - $script_path/step_place.tcl
    - name: cts
      command:
        - cd $work_path;
        - *innovus_unix
        - "-log log/pnr_cts.log"
        - *innovus_args
        - $script_path/step_cts.tcl
    - name: route
      command:
        - cd $work_path;
        - *innovus_unix
        - "-log log/pnr_route.log"
        - *innovus_args
        - $script_path/step_route.tcl
    - name: signoff
      command:
        - cd $work_path;
        - *innovus_unix
        - "-log log/pnr_signoff.log"
        - *innovus_args
        - $script_path/step_signoff.tcl

##############################################
# Flows
##############################################

# Each flow only sets the parameters it changes: the steps and the scripts are
# the default flow's. Add a strategy of your own the same way, in the tool.yml
# of your workspace.

flows:

  standard:
    label: "Standard"
    description: "Standard flow effort at 70% utilization, Innovus defaults otherwise"

  express:
    label: "Express"
    description: "Express flow effort: the shortest runtime, for early estimates"
    parameters:
      flow_effort: express
      # Without it, an express flow does not route at all (NRIG-142)
      design_options: [-expressRoute, "true"]

  extreme:
    label: "Extreme"
    description: "Extreme flow effort: the longest runtime, for the best results"
    parameters:
      flow_effort: extreme

  timing:
    label: "Timing"
    description: "Lower utilization, high timing effort placement, useful skew, timing and SI driven routing, hold fixing"
    parameters:
      utilization: 0.6
      place_options: [-place_global_timing_effort, high]
      opt_options: [-usefulSkew, "true", -usefulSkewCCOpt, standard, -usefulSkewPostRoute, "true"]
      route_options: [-routeWithTimingDriven, "true", -routeWithSiDriven, "true"]
      fix_hold: true

  area:
    label: "Area"
    description: "Dense floorplan with high congestion effort placement and area reclaim"
    parameters:
      utilization: 0.85
      place_options: [-place_global_cong_effort, high]
      opt_options: [-reclaimArea, "true"]

  power:
    label: "Power"
    description: "High power effort, optimizing dynamic power as much as leakage"
    parameters:
      power_effort: high
      # 1 (the default) only optimizes leakage, 0 only dynamic power
      opt_options: [-leakageToDynamicRatio, 0.5]

# Log formatting
format:

  logs:
    error:         ['<error>', '**ERROR']
    warning:       ['<warning>', '**WARN']
    info:          ['<note>', '**INFO']

  tags:
    bold:          ['<bold>']
    end:           ['<end>']
    red:           ['<red>']
    green:         ['<green>']
    yellow:        ['<yellow>']
    cyan:          ['<cyan>']
    grey:          ['<grey>']

  replace:
    - "(Slack \\(VIOLATED\\))": "<red>$1<end>"
    - "(Slack \\(MET\\))": "<green>$1<end>"
