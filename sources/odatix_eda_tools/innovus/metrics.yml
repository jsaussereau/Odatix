##############################################
# Metrics for Innovus
##############################################
#
# Post place & route numbers. The patterns below match the default Innovus
# report format; adapt them if your flow writes its reports differently.
# report_area prints a table whose first row not indented is the top level
# module: "<top>  <instance count>  <total area>".
#
# The names and units are those of the synthesis tools (Design Compiler, Genus)
# and of LibreLane, so that Explorer shows a synthesis estimate and the result
# of its place & route as the same metric: report_area gives the area of the
# cells, which is "Cell_Area" for them too.

pnr_metrics:
  Cell_Area:
    type: regex
    settings:
      file: report/area.rep
      pattern: "^\\S+\\s+([0-9]+)\\s+([0-9.]+)\\s*$"
      group_id: 2
    format: "%.2f"
    unit: um^2

  Cell_count:
    type: regex
    error_if_missing: No
    settings:
      file: report/area.rep
      pattern: "^\\S+\\s+([0-9]+)\\s+([0-9.]+)\\s*$"
      group_id: 1
    format: "%.0f"

  Die_area:
    type: regex
    error_if_missing: No
    settings:
      file: report/floorplan.rep
      pattern: "Die area: ([0-9.]+)"
      group_id: 1
    format: "%.2f"
    unit: um^2

  Core_utilization:
    type: regex
    error_if_missing: No
    settings:
      file: report/floorplan.rep
      pattern: "Core utilization: ([0-9.]+)"
      group_id: 1
    format: "%.4f"

  Total_Power:
    type: regex
    error_if_missing: No
    settings:
      file: report/power.rep
      pattern: "Total Power:\\s*([0-9.e+-]+)"
      group_id: 1
    format: "%.4f"
    unit: mW

  Worst_Slack:
    type: regex
    error_if_missing: No
    settings:
      file: report/timing.rep
      pattern: "Slack Time\\s+([0-9.-]+)"
      group_id: 1
    format: "%.3f"
    unit: ns

metrics:
  Param_Domains:
    type: yaml
    error_if_missing: No
    settings:
      file: param_domains.yml
