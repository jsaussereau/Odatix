##############################################
# Metrics for Fusion Compiler
##############################################

# Read once per step of the flow: "$step" in a file name is the step the record
# being written is for (report/synthesis/, report/pnr/), so post-synthesis and
# post-route area are the same metric measured at two steps.

fmax_synthesis_metrics:
  Fmax:
    type: regex
    settings:
      file: log/frequency_search.log
      pattern: "(.*)Highest frequency with timing constraints being met: ([0-9_]+) MHz"
      group_id: 2
    format: "%.0f"
    unit: MHz

custom_freq_synthesis_metrics:
  Frequency:
    type: regex
    settings:
      file: frequency.txt
      pattern: "([0-9_]+) MHz"
      group_id: 1
    format: "%.0f"
    unit: MHz

metrics:
  Cell_Area:
    type: regex
    settings:
      file: report/$step/area.rep
      pattern: "Total cell area:(\\s*)([0-9,.]+)(.*)"
      group_id: 2
    format: "%.3f"
    unit: um^2

  Comb_Area:
    type: regex
    settings:
      file: report/$step/area.rep
      pattern: "Combinational area:(\\s*)([0-9,.]+)(.*)"
      group_id: 2
    format: "%.3f"
    unit: um^2

  Noncomb_Area:
    type: regex
    settings:
      file: report/$step/area.rep
      pattern: "Noncombinational area:(\\s*)([0-9,.]+)(.*)"
      group_id: 2
    format: "%.3f"
    unit: um^2

  Buf_Inv_Area:
    type: regex
    settings:
      file: report/$step/area.rep
      pattern: "Buf/Inv area:(\\s*)([0-9,.]+)(.*)"
      group_id: 2
    format: "%.3f"
    unit: um^2

  Macro_Area:
    type: regex
    settings:
      file: report/$step/area.rep
      pattern: "Macro/Black Box area:(\\s*)([0-9,.]+)(.*)"
      group_id: 2
    format: "%.3f"
    unit: um^2

  Cell_count:
    type: regex
    settings:
      file: report/$step/area.rep
      pattern: "Number of cells:(\\s*)([0-9,.]+)(.*)"
      group_id: 2
    format: "%.0f"

  # Physical mode and place and route only (report_utilization)
  Utilization:
    type: regex
    error_if_missing: No
    settings:
      file: report/$step/utilization.rep
      pattern: "Utilization Ratio:(\\s*)([0-9.]+)"
      group_id: 2
    format: "%.4f"

  # Timing
  #
  # Worst slack of the design, read from the first path of the timing report —
  # "report_timing" reports the worst path first.

  Worst_Slack:
    type: regex
    error_if_missing: No
    settings:
      file: report/$step/timing.rep
      pattern: "[Ss]lack \\(\\w+\\)\\s+(-?[0-9.]+)"
      group_id: 1
    format: "%.3f"
    unit: ns

  # Power, summed in mW by the scripts whatever the units of the libraries
  # (see odatix_fc_power_summary in tcl/step_common.tcl)

  Internal_Power:
    type: regex
    settings:
      file: report/$step/power.rep
      pattern: "Odatix power \\(mW\\): internal (\\S+) switching (\\S+) leakage (\\S+) total (\\S+)"
      group_id: 1
    format: "%.6f"
    unit: mW

  Switching_Power:
    type: regex
    settings:
      file: report/$step/power.rep
      pattern: "Odatix power \\(mW\\): internal (\\S+) switching (\\S+) leakage (\\S+) total (\\S+)"
      group_id: 2
    format: "%.6f"
    unit: mW

  Leakage_Power:
    type: regex
    settings:
      file: report/$step/power.rep
      pattern: "Odatix power \\(mW\\): internal (\\S+) switching (\\S+) leakage (\\S+) total (\\S+)"
      group_id: 3
    format: "%.6f"
    unit: mW

  Total_Power:
    type: regex
    settings:
      file: report/$step/power.rep
      pattern: "Odatix power \\(mW\\): internal (\\S+) switching (\\S+) leakage (\\S+) total (\\S+)"
      group_id: 4
    format: "%.6f"
    unit: mW

  Param_Domains:
    type: yaml
    error_if_missing: No
    settings:
      file: param_domains.yml
