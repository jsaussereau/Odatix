##############################################
# Simulation template: Questa / ModelSim
##############################################
# Provided by Odatix. Compiles, elaborates and runs the design under test and
# its testbench, as "odatix_sim.yml" describes them (see run.py). Name it in
# the run settings, or start a simulation from it with "template: questa".

description: "Questa or ModelSim, for VHDL, Verilog, SystemVerilog and mixed designs"

# The languages it compiles: a design written in another one is refused when
# the run is checked.
languages: [vhdl, verilog, sv]

# Tells whether the simulator is installed.
test_command: [vsim, -version]

tasks:
  - name: main
    commands:
      - '"${python}" run.py "${odatix_path}"'

progress:
  file: "log/progress.log"
  regex: "(.*): ([0-9]+)%(.*)"
